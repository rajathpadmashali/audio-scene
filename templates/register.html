{% extends "base.html" %}
{% block title %}Register — AudioScene{% endblock %}

{% block head %}
<style>
    .auth-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 200px);
    }
    .auth-card {
        width: 100%;
        max-width: 420px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 3rem 2.5rem;
        box-shadow: var(--shadow-lg);
        animation: authFloat 0.6s cubic-bezier(0.16,1,0.3,1);
    }
    @keyframes authFloat {
        from { opacity: 0; transform: translateY(24px) scale(0.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .auth-card h1 {
        font-size: 1.8rem;
        margin-bottom: 0.25rem;
    }
    .auth-card .subtitle {
        margin-bottom: 2rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h1>Create account</h1>

        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Pick a username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Create a password" required>
            </div>
            <button type="submit" class="btn btn-lg" style="width:100%;">Create Account</button>
        </form>

        <p class="text-center text-muted mt-3" style="font-size:0.9rem;">
            Already have an account? <a href="/login">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
