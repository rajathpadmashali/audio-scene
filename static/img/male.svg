            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#1e3a8a" />
        </linearGradient>
    </defs>
    <rect width="200" height="200" fill="url(#bg)" />
    <!-- Hair -->
    <path d="M 50 80 Q 100 20 150 80 Q 180 120 150 160 Q 100 90 50 160 Q 20 120 50 80 Z" fill="#1e293b"/>
    <!-- Face -->
